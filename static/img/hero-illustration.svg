<svg width="560" height="420" viewBox="0 0 560 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="560" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f9f7"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f6b5e"/>
      <stop offset="100%" stop-color="#168a78"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4614a"/>
      <stop offset="100%" stop-color="#de7861"/>
    </linearGradient>
    <filter id="softShadow" x="-10" y="-10" width="580" height="440" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f4438" flood-opacity="0.08"/>
    </filter>
    <filter id="elemShadow" x="0" y="0" width="300" height="200" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f4438" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="20" y="20" width="520" height="380" rx="20" fill="url(#cardGrad)" stroke="#d6e3df" stroke-width="1.5" filter="url(#softShadow)"/>
  
  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.4" stroke="#dbe7e3" stroke-width="1" stroke-dasharray="4 4">
    <line x1="20" y1="90" x2="540" y2="90" />
    <line x1="20" y1="160" x2="540" y2="160" />
    <line x1="20" y1="230" x2="540" y2="230" />
    <line x1="20" y1="300" x2="540" y2="300" />
    <line x1="160" y1="20" x2="160" y2="400" />
    <line x1="300" y1="20" x2="300" y2="400" />
    <line x1="440" y1="20" x2="440" y2="400" />
  </g>

  <!-- Top Header bar in mock UI -->
  <rect x="42" y="44" width="476" height="36" rx="8" fill="#ffffff" stroke="#e0ece8" stroke-width="1"/>
  <circle cx="62" cy="62" r="5" fill="#c4614a"/>
  <circle cx="78" cy="62" r="5" fill="#b38b3e"/>
  <circle cx="94" cy="62" r="5" fill="#0f6b5e"/>
  <rect x="120" y="56" width="140" height="12" rx="6" fill="#e8f2ee"/>
  <rect x="440" y="54" width="64" height="16" rx="8" fill="#e4f2ef"/>
  <text x="472" y="66" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="9" font-weight="600" fill="#0f6b5e">ESCO v1.2</text>

  <!-- Main Showcase Card: Candidate Match Analysis -->
  <rect x="44" y="102" width="280" height="276" rx="14" fill="#ffffff" stroke="#dce7e3" stroke-width="1.2" filter="url(#elemShadow)"/>
  
  <!-- Candidate Info Mini-Row -->
  <circle cx="72" cy="132" r="14" fill="#e4f2ef"/>
  <text x="72" y="136" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="700" fill="#0f6b5e">AM</text>
  <rect x="96" y="124" width="90" height="10" rx="5" fill="#2d4440"/>
  <rect x="96" y="138" width="130" height="8" rx="4" fill="#8ba29c"/>

  <!-- Divider -->
  <line x1="60" y1="160" x2="308" y2="160" stroke="#edf3f0" stroke-width="1"/>

  <!-- Extracted Skills Showcase -->
  <text x="60" y="180" font-family="'IBM Plex Sans', sans-serif" font-size="10" font-weight="700" fill="#0f6b5e" letter-spacing="0.8">IDENTIFIED SKILLS</text>
  
  <g transform="translate(60, 192)">
    <!-- Skill Chip 1 -->
    <rect x="0" y="0" width="62" height="22" rx="4" fill="#e4f2ef" stroke="#c4ded6"/>
    <text x="31" y="14" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="10" font-weight="500" fill="#0f6b5e">Python</text>

    <!-- Skill Chip 2 -->
    <rect x="68" y="0" width="50" height="22" rx="4" fill="#e4f2ef" stroke="#c4ded6"/>
    <text x="93" y="14" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="10" font-weight="500" fill="#0f6b5e">SQL</text>

    <!-- Skill Chip 3 -->
    <rect x="124" y="0" width="70" height="22" rx="4" fill="#e4f2ef" stroke="#c4ded6"/>
    <text x="159" y="14" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="10" font-weight="500" fill="#0f6b5e">Analytics</text>

    <!-- Skill Chip 4 -->
    <rect x="0" y="28" width="92" height="22" rx="4" fill="#e4f2ef" stroke="#c4ded6"/>
    <text x="46" y="42" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="10" font-weight="500" fill="#0f6b5e">Machine Learning</text>

    <!-- Skill Chip 5 -->
    <rect x="98" y="28" width="60" height="22" rx="4" fill="#e4f2ef" stroke="#c4ded6"/>
    <text x="128" y="42" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="10" font-weight="500" fill="#0f6b5e">Pandas</text>
  </g>

  <!-- Verified Documents Badges -->
  <rect x="60" y="260" width="248" height="38" rx="8" fill="#f6faf8" stroke="#e0ede8"/>
  <path d="M74 274L77 277L84 270" stroke="#0f6b5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="278" font-family="'IBM Plex Sans', sans-serif" font-size="10" font-weight="600" fill="#1c2e2a">Resume &amp; Certificate Verified</text>
  <text x="92" y="290" font-family="'IBM Plex Sans', sans-serif" font-size="9" fill="#758c86">SHA-256 Checksum Passed</text>

  <!-- Progress bar in card -->
  <text x="60" y="322" font-family="'IBM Plex Sans', sans-serif" font-size="9" font-weight="600" fill="#5a6f6a">Overall Profile Confidence</text>
  <rect x="60" y="330" width="248" height="6" rx="3" fill="#e3ede9"/>
  <rect x="60" y="330" width="216" height="6" rx="3" fill="url(#tealGrad)"/>

  <!-- Right Floating Metric Card: Top Match -->
  <g transform="translate(340, 102)">
    <rect width="176" height="130" rx="14" fill="#ffffff" stroke="#cde3db" stroke-width="1.2" filter="url(#elemShadow)"/>
    <rect x="14" y="14" width="80" height="8" rx="4" fill="#a0b8b2"/>
    <text x="14" y="44" font-family="'IBM Plex Sans', sans-serif" font-size="15" font-weight="700" fill="#1c2e2a">Data Scientist</text>
    
    <rect x="14" y="58" width="58" height="24" rx="6" fill="#e4f2ef"/>
    <text x="43" y="74" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="700" fill="#0f6b5e">92.4%</text>

    <!-- Match Bar -->
    <rect x="14" y="96" width="148" height="6" rx="3" fill="#e5efe9"/>
    <rect x="14" y="96" width="136" height="6" rx="3" fill="#0f6b5e"/>
    <text x="14" y="116" font-family="'IBM Plex Sans', sans-serif" font-size="9" fill="#758c86">Cosine similarity · ESCO</text>
  </g>

  <!-- Second Floating Card: Skill-Gap Alert -->
  <g transform="translate(340, 248)">
    <rect width="176" height="130" rx="14" fill="#ffffff" stroke="#ebd5d0" stroke-width="1.2" filter="url(#elemShadow)"/>
    <rect x="14" y="14" width="24" height="24" rx="6" fill="#f7ece9"/>
    <path d="M26 22V27M26 31H26.01" stroke="#c4614a" stroke-width="2" stroke-linecap="round"/>
    <text x="46" y="27" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="700" fill="#1c2e2a">Growth Action</text>
    <text x="46" y="38" font-family="'IBM Plex Sans', sans-serif" font-size="9" fill="#8c3b2a">Recommended</text>

    <text x="14" y="66" font-family="'IBM Plex Sans', sans-serif" font-size="10" font-weight="600" fill="#2f4440">Target Skill:</text>
    <rect x="14" y="72" width="100" height="20" rx="4" fill="#f7ece9"/>
    <text x="22" y="86" font-family="'IBM Plex Sans', sans-serif" font-size="9" font-weight="600" fill="#c4614a">Model Evaluation</text>

    <text x="14" y="110" font-family="'IBM Plex Sans', sans-serif" font-size="9" fill="#7a8c88">Cert: AI Evaluation Specialization</text>
  </g>

  <!-- Connection Indicator Arrow / Dots -->
  <circle cx="332" cy="165" r="3.5" fill="#0f6b5e"/>
  <circle cx="332" cy="290" r="3.5" fill="#c4614a"/>
</svg>
